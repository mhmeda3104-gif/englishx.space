<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile - ESTL Tech</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <style>
    .profile-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 2px solid var(--border);
    }
    .profile-info h1 {
      margin: 0;
      font-size: 28px;
    }
    .profile-info p {
      margin: 4px 0 0;
      color: var(--text-secondary);
    }
    .order-history {
      margin-top: 40px;
    }
    .order-card {
      padding: 20px;
      margin-bottom: 16px;
      border-left: 4px solid var(--primary);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
  </style>
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
    <nav class="navbar" id="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon"><img src="logo.png" alt="ESTL Logo"></div>
      <span class="brand-text" style="text-transform:uppercase; font-size: 22px;">ESTL Store</span>
    </a>
    
    <ul class="nav-links" style="position:absolute; left:50%; transform:translateX(-50%);">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="ai-builder.html">AI Builder</a></li>
      </ul>

    <div class="nav-actions" style="display:flex; align-items:center; gap:20px;">
      <a href="auth.html" title="Profile/Login" style="color:var(--text-primary); transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="cart.html" title="Cart" style="color:var(--text-primary); position:relative; transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span id="cartCount" style="position:absolute; top:-8px; right:-10px; background:red; color:white; font-size:11px; font-weight:bold; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center;">0</span>
      </a>
      <button id="themeToggleBtn" aria-label="Toggle Theme" onclick="toggleTheme()" style="background:transparent; border:none; color:var(--text-primary); cursor:pointer; font-size:18px;">🌙</button>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <section class="section" style="padding-top: 120px; min-height: 80vh;">
    <div class="container profile-container">
      
      <div class="card">
        <div class="profile-header">
          <div class="profile-avatar">👤</div>
          <div class="profile-info">
            <h1 id="profileName">Loading...</h1>
            <p id="profileEmail">loading@example.com</p>
            <button class="btn btn-ghost" style="margin-top: 16px; padding: 6px 16px; font-size: 13px;" onclick="firebase.auth().signOut()">Sign Out</button>
          </div>
        </div>

        <div class="order-history">
          <h2>Order History</h2>
          <div id="ordersContainer">
            <p style="color: var(--text-muted); margin-top: 16px;">Loading orders...</p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="auth-guard.js"></script>
  <script src="app.js"></script>
  <script>
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('estl_cart') || '[]');
      const total = cart.reduce((sum, item) => sum + item.qty, 0);
      const el = document.getElementById('cartCount');
      if(el) el.innerText = total;
    }
    document.addEventListener('DOMContentLoaded', updateCartCount);

    firebase.auth().onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('profileName').innerText = user.displayName || "Engineer";
        document.getElementById('profileEmail').innerText = user.email;
        loadOrders(user.uid);
      }
    });

    function loadOrders(uid) {
      firebase.database().ref(`users/${uid}/orders`).once('value').then(snap => {
        const container = document.getElementById('ordersContainer');
        if(!snap.exists()) {
          container.innerHTML = `<p style="color: var(--text-muted); margin-top: 16px;">You haven't placed any orders yet.</p>`;
          return;
        }

        container.innerHTML = '';
        const orders = snap.val();
        
        // Sort by date descending
        const sortedOrderKeys = Object.keys(orders).sort((a,b) => new Date(orders[b].date) - new Date(orders[a].date));

        sortedOrderKeys.forEach(key => {
          const order = orders[key];
          const date = new Date(order.date).toLocaleDateString();
          
          let itemsHtml = '';
          order.items.forEach(item => {
            itemsHtml += `
              <div class="order-item">
                <span>${item.qty}x ${item.name}</span>
                <span>$${(item.price * item.qty).toFixed(2)}</span>
              </div>
            `;
          });

          container.innerHTML += `
            <div class="card order-card">
              <div class="order-header">
                <div>
                  <strong>Order #${key.slice(-6)}</strong>
                  <div style="font-size: 12px; color: var(--text-muted); margin-top:4px;">${date}</div>
                </div>
                <div>
                  <span class="badge badge-primary">${order.status || 'Processing'}</span>
                </div>
              </div>
              <div style="margin-bottom: 12px;">
                ${itemsHtml}
              </div>
              <div style="border-top: 1px solid var(--border); padding-top: 12px; text-align: right; font-weight: bold;">
                Total: $${order.total.toFixed(2)}
              </div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
