<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members - ESTL Community</title>
  <meta name="description" content="Meet the ESTL community — engineers, makers, and builders showcasing their projects.">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="auth.css?v=2">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    .members-section {
      padding-top: 120px;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .members-header {
      text-align: center;
      margin-bottom: 48px;
    }
    .members-header h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 800;
      margin: 0 0 12px;
      font-family: 'Space Grotesk', sans-serif;
    }
    .members-header p {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto;
    }
    .members-count {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      background: rgba(0, 255, 157, 0.08);
      border: 1px solid rgba(0, 255, 157, 0.2);
      border-radius: 999px;
      font-size: 14px;
      color: var(--primary-light);
      font-weight: 600;
      margin-bottom: 20px;
    }
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .member-card {
      padding: 28px 24px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .member-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-glow);
    }
    .member-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 16px;
      background: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      border: 2px solid var(--border);
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }
    .member-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
    }
    .member-username {
      font-size: 13px;
      color: var(--primary-light);
      margin: 0 0 10px;
    }
    .member-bio {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin: 0 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .member-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
    }
    .member-stat {
      text-align: center;
    }
    .member-stat-val {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .member-stat-lbl {
      font-size: 11px;
      color: var(--text-muted);
    }
    .member-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .member-tag {
      padding: 3px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .members-loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 16px;
    }
    .members-search {
      max-width: 420px;
      margin: 0 auto 32px;
      position: relative;
    }
    .members-search input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    .members-search input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.1);
    }
    .members-search .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    @media (max-width: 768px) {
      .members-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon"><img src="logo.png" alt="ESTL Logo"></div>
      <span class="brand-text" style="text-transform:uppercase; font-size: 22px;">ESTL Store</span>
    </a>
    <ul class="nav-links" style="position:absolute; left:50%; transform:translateX(-50%);">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="ai-builder.html">AI Builder</a></li>
    </ul>
    <div class="nav-actions" style="display:flex; align-items:center; gap:20px;">
      <a href="profile.html" title="Profile" style="color:var(--text-primary); transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="cart.html" title="Cart" style="color:var(--text-primary); position:relative; transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span id="cartCount" style="position:absolute; top:-8px; right:-10px; background:red; color:white; font-size:11px; font-weight:bold; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center;">0</span>
      </a>
      <button id="themeToggleBtn" aria-label="Toggle Theme" onclick="toggleTheme()" style="background:transparent; border:none; color:var(--text-primary); cursor:pointer; font-size:18px;">🌙</button>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Members Content -->
  <section class="section members-section">
    <div class="container">
      <div class="members-header">
        <div class="members-count" id="membersCount">👥 Loading...</div>
        <h1>Our <span class="gradient-text">Community</span></h1>
        <p>Meet the engineers and makers building the future with ESTL hardware.</p>
      </div>

      <div class="members-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search members..." oninput="filterMembers()">
      </div>

      <div id="membersGrid" class="members-grid">
        <div class="members-loading">Loading members... ⏳</div>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="auth-guard.js"></script>
  <script src="app.js?v=2"></script>
  <script>
    // Cart count
    (function(){
      const cart = JSON.parse(localStorage.getItem('estl_cart') || '[]');
      const el = document.getElementById('cartCount');
      if(el) el.innerText = cart.reduce((s, i) => s + i.qty, 0);
    })();

    let allMembers = [];

    // Load all members - wait for auth to ensure permissions
    firebase.auth().onAuthStateChanged(user => {
      // Even if not logged in (guest), try to fetch. But auth usually needed for DB rules.
      firebase.database().ref('users').once('value').then(snap => {
        const grid = document.getElementById('membersGrid');
        const countEl = document.getElementById('membersCount');

        if (!snap.exists()) {
          grid.innerHTML = '<div class="members-loading">No members yet.</div>';
          countEl.textContent = '👥 0 Members';
          return;
        }

        const users = snap.val();
        const keys = Object.keys(users);
        countEl.textContent = `👥 ${keys.length} Member${keys.length !== 1 ? 's' : ''}`;

        allMembers = keys.map(uid => ({ uid, ...users[uid] }));
        // Sort: most projects first, then by XP
        allMembers.sort((a, b) => {
          const projA = Object.keys(a.projects || {}).length;
          const projB = Object.keys(b.projects || {}).length;
          if (projB !== projA) return projB - projA;
          return (b.xp || 0) - (a.xp || 0);
        });

        renderMembers(allMembers);
      }).catch(err => {
        console.error("Firebase DB Error:", err);
        const grid = document.getElementById('membersGrid');
        grid.innerHTML = `<div class="members-loading" style="color:var(--danger)">Error loading members. You might not have permission to view this yet.</div>`;
        document.getElementById('membersCount').textContent = '👥 Error';
      });
    });

    function renderMembers(members) {
      const grid = document.getElementById('membersGrid');
      if (members.length === 0) {
        grid.innerHTML = '<div class="members-loading">No members found.</div>';
        return;
      }

      grid.innerHTML = members.map(u => {
        const projCount = Object.keys(u.projects || {}).length;
        const projectTags = getTopTags(u.projects);
        const avatar = u.photoURL
          ? `<div class="member-avatar" style="background-image:url('${esc(u.photoURL)}')"></div>`
          : `<div class="member-avatar">👤</div>`;

        return `
          <a href="profile.html?id=${u.uid}" class="card member-card" style="display:block; text-decoration:none;" data-name="${esc(u.name || '')}" data-username="${esc(u.username || '')}">
            ${avatar}
            <h3 class="member-name">${esc(u.name || 'Space Learner')}</h3>
            <p class="member-username">@${esc(u.username || 'user')}</p>
            ${u.bio ? `<p class="member-bio">${esc(u.bio)}</p>` : ''}
            <div class="member-stats">
              <div class="member-stat">
                <div class="member-stat-val">${projCount}</div>
                <div class="member-stat-lbl">Projects</div>
              </div>
              <div class="member-stat">
                <div class="member-stat-val">${u.level || 1}</div>
                <div class="member-stat-lbl">Level</div>
              </div>
              <div class="member-stat">
                <div class="member-stat-val">${u.xp || 0}</div>
                <div class="member-stat-lbl">XP</div>
              </div>
            </div>
            ${projectTags.length ? `<div class="member-tags">${projectTags.map(t => `<span class="member-tag">${esc(t)}</span>`).join('')}</div>` : ''}
          </a>
        `;
      }).join('');
    }

    function getTopTags(projects) {
      if (!projects) return [];
      const tagCount = {};
      Object.values(projects).forEach(p => {
        (p.tags || []).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; });
      });
      return Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 4).map(e => e[0]);
    }

    function filterMembers() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) { renderMembers(allMembers); return; }
      const filtered = allMembers.filter(u =>
        (u.name || '').toLowerCase().includes(q) ||
        (u.username || '').toLowerCase().includes(q) ||
        (u.bio || '').toLowerCase().includes(q)
      );
      renderMembers(filtered);
    }

    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }
  </script>
</body>
</html>
