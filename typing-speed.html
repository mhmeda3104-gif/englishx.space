<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESTL - Typing Speed Practice</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    .typing-container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      position: relative;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .stat-box {
      text-align: center;
    }
    .stat-box .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-box .stat-value {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary-light);
      font-family: 'Space Grotesk', monospace;
    }
    .text-display {
      font-size: 24px;
      line-height: 1.6;
      font-family: monospace;
      color: var(--text-muted);
      margin-bottom: 30px;
      user-select: none;
      position: relative;
    }
    .char {
      position: relative;
      transition: color 0.1s;
    }
    .char.correct {
      color: var(--success);
    }
    .char.incorrect {
      color: var(--danger);
      background: rgba(255, 0, 85, 0.2);
      border-radius: 3px;
    }
    .char.active {
      color: var(--text-primary);
    }
    .char.active::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 3px;
      background: var(--primary);
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .snippet-title {
      font-size: 14px;
      color: var(--secondary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon"><img src="logo.png" alt="ESTL Logo"></div>
      <span class="brand-text" style="text-transform:uppercase; font-size: 22px;">ESTL Store</span>
    </a>
    
    <ul class="nav-links" style="position:absolute; left:50%; transform:translateX(-50%);">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="practice.html" class="active">Practice</a></li>
      <li><a href="ai-builder.html">AI Builder</a></li>
    </ul>

    <div class="nav-actions" style="display:flex; align-items:center; gap:20px;">
      <a href="profile.html" title="Profile" style="color:var(--text-primary); transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="cart.html" title="Cart" style="color:var(--text-primary); position:relative; transition: opacity 0.3s;" onmouseover="this.style.opacity=0.7" onmouseout="this.style.opacity=1">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span id="cartCount" style="position:absolute; top:-8px; right:-10px; background:red; color:white; font-size:11px; font-weight:bold; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center;">0</span>
      </a>
      <button id="themeToggleBtn" aria-label="Toggle Theme" onclick="toggleTheme()" style="background:transparent; border:none; color:var(--text-primary); cursor:pointer; font-size:18px;">🌙</button>
    </div>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <section class="section" style="padding-top: 120px;">
    <div class="container">
      <div style="text-align: center; margin-bottom: 20px;">
        <h1 class="section-title">Typing <span class="gradient-text">Speed</span> Test</h1>
        <p class="section-subtitle">قم بكتابة الكود البرمجي بأسرع وأدق شكل ممكن.</p>
      </div>

      <div class="typing-container" onclick="focusInput()">
        <div class="stats-bar">
          <div class="stat-box">
            <div class="stat-label">Time Left</div>
            <div class="stat-value" id="timeLeft">60</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">WPM</div>
            <div class="stat-value" id="wpm">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Accuracy</div>
            <div class="stat-value" id="accuracy">100%</div>
          </div>
        </div>

        <div class="snippet-title" id="snippetTitle">C++ Arduino Snippet</div>
        <div class="text-display" id="textDisplay">Loading snippet...</div>
        
        <input type="text" class="typing-input" id="typingInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="controls">
          <button class="btn btn-primary" onclick="initTest()">Restart Test</button>
          <a href="practice.html" class="btn btn-ghost">Back to Practice</a>
        </div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
  <script>
    const snippets = [
      {
        title: "Arduino - Blink LED",
        text: "void setup() { pinMode(LED_BUILTIN, OUTPUT); } void loop() { digitalWrite(LED_BUILTIN, HIGH); delay(1000); digitalWrite(LED_BUILTIN, LOW); delay(1000); }"
      },
      {
        title: "Python - Hello World",
        text: "def greet(name):\n    print(f'Hello, {name}!')\n\ngreet('Space Academy')"
      },
      {
        title: "C++ - For Loop",
        text: "for (int i = 0; i < 10; i++) {\n    Serial.println(i);\n    delay(500);\n}"
      }
    ];

    const textDisplay = document.getElementById('textDisplay');
    const typingInput = document.getElementById('typingInput');
    const timeLeftDisplay = document.getElementById('timeLeft');
    const wpmDisplay = document.getElementById('wpm');
    const accuracyDisplay = document.getElementById('accuracy');
    const snippetTitleDisplay = document.getElementById('snippetTitle');

    let timer = 60;
    let timeLeft = timer;
    let timeInterval;
    let isTyping = false;
    let charIndex = 0;
    let mistakes = 0;
    let currentSnippet = "";

    function getRandomSnippet() {
      const idx = Math.floor(Math.random() * snippets.length);
      return snippets[idx];
    }

    function initTest() {
      const snippetObj = getRandomSnippet();
      currentSnippet = snippetObj.text;
      snippetTitleDisplay.innerText = snippetObj.title;

      textDisplay.innerHTML = "";
      currentSnippet.split('').forEach(char => {
        let span = document.createElement('span');
        span.innerText = char;
        span.classList.add('char');
        textDisplay.appendChild(span);
      });

      textDisplay.querySelectorAll('.char')[0].classList.add('active');
      
      document.addEventListener('keydown', () => typingInput.focus());
      typingInput.value = "";
      charIndex = 0;
      mistakes = 0;
      isTyping = false;
      timeLeft = timer;
      timeLeftDisplay.innerText = timeLeft;
      wpmDisplay.innerText = "0";
      accuracyDisplay.innerText = "100%";
      clearInterval(timeInterval);
      typingInput.disabled = false;
      focusInput();
    }

    function focusInput() {
      typingInput.focus();
    }

    function updateTimer() {
      if(timeLeft > 0) {
        timeLeft--;
        timeLeftDisplay.innerText = timeLeft;
        let wpm = Math.round((((charIndex - mistakes) / 5) / (timer - timeLeft)) * 60);
        wpmDisplay.innerText = wpm < 0 || !wpm || wpm === Infinity ? 0 : wpm;
      } else {
        clearInterval(timeInterval);
        typingInput.disabled = true;
        showToast("انتهى الوقت! 🎉", "success");
      }
    }

    typingInput.addEventListener("input", () => {
      const chars = textDisplay.querySelectorAll('.char');
      const typedChar = typingInput.value.split('')[charIndex];

      if(charIndex < chars.length - 1 && timeLeft > 0) {
        if(!isTyping) {
          timeInterval = setInterval(updateTimer, 1000);
          isTyping = true;
        }

        if(typedChar == null) {
          // Backspace
          charIndex--;
          if(chars[charIndex].classList.contains('incorrect')) {
            mistakes--;
          }
          chars[charIndex].classList.remove('correct', 'incorrect');
        } else {
          if(chars[charIndex].innerText === typedChar || (chars[charIndex].innerText === '\n' && typedChar === ' ')) {
            chars[charIndex].classList.add('correct');
          } else {
            mistakes++;
            chars[charIndex].classList.add('incorrect');
          }
          charIndex++;
        }

        chars.forEach(span => span.classList.remove('active'));
        if (charIndex < chars.length) {
          chars[charIndex].classList.add('active');
        }

        let accuracy = Math.round(((charIndex - mistakes) / charIndex) * 100);
        accuracyDisplay.innerText = accuracy < 0 || !accuracy ? "100%" : accuracy + "%";
      } else if (charIndex >= chars.length - 1) {
        // Finished
        clearInterval(timeInterval);
        typingInput.disabled = true;
        showToast("ممتاز! لقد أكملت الكود. ", "success");
      }
    });

    window.onload = initTest;
  </script>
</body>
</html>
