<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In — Space Academy</title>
  <meta name="description" content="Sign in to Space Academy and continue your English learning journey.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">

  <!-- Background -->
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>
  <div class="auth-orb auth-orb-3"></div>
  <div class="stars" id="stars"></div>

  <!-- Auth Card -->
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="auth-brand-icon">🚀</span>
      <div class="auth-brand-name">Space Academy</div>
      <div class="auth-brand-tagline">Your learning journey starts here</div>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Sign In</button>
      <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div class="auth-form active" id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input class="auth-input" type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input class="auth-input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
          <button class="toggle-pw" type="button" onclick="togglePw('loginPassword', this)">👁️</button>
        </div>
      </div>
      <button class="btn-auth btn-auth-primary" id="loginBtn" onclick="loginWithEmail()">
        Sign In
      </button>
    </div>

    <!-- Signup Form -->
    <div class="auth-form" id="signupForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input class="auth-input" type="text" id="signupName" placeholder="Your name" autocomplete="name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-wrap">
          <span class="input-icon">✉️</span>
          <input class="auth-input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input class="auth-input" type="password" id="signupPassword" placeholder="min. 6 characters" autocomplete="new-password">
          <button class="toggle-pw" type="button" onclick="togglePw('signupPassword', this)">👁️</button>
        </div>
      </div>
      <button class="btn-auth btn-auth-primary" id="signupBtn" onclick="signupWithEmail()">
        Create Account 🎓
      </button>
    </div>

    <!-- Divider -->
    <div class="auth-divider"><span>or continue with</span></div>

    <!-- Google Button -->
    <button class="btn-auth btn-google" id="googleBtn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
        <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <!-- Message -->
    <div class="auth-message" id="authMessage"></div>

    <!-- Guest -->
    <div class="auth-guest">
      <a href="#" onclick="enterAsGuest()">Continue as guest →</a>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>
    // ── Firebase Config ──
    const firebaseConfig = {
      apiKey: "AIzaSyBydQb6wDh4X7JA0JkcuhToJam66VD3bTM",
      authDomain: "englishx-ed1c6.firebaseapp.com",
      projectId: "englishx-ed1c6",
      storageBucket: "englishx-ed1c6.firebasestorage.app",
      messagingSenderId: "570756105739",
      appId: "1:570756105739:web:69c4b5edd62cc34c56290e"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ── Stars ──
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.cssText = `
        left: ${Math.random() * 100}%;
        top: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 3}s;
        animation-duration: ${2 + Math.random() * 3}s;
        width: ${Math.random() > 0.7 ? 3 : 2}px;
        height: ${Math.random() > 0.7 ? 3 : 2}px;
        opacity: ${0.3 + Math.random() * 0.7};
      `;
      starsContainer.appendChild(star);
    }

    // ── Check if already logged in ──
    auth.onAuthStateChanged(user => {
      if (user) {
        const redirect = sessionStorage.getItem('authRedirect') || 'index.html';
        sessionStorage.removeItem('authRedirect');
        window.location.href = redirect;
      }
    });

    // ── Tab Switch ──
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById(tab + 'Tab').classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
      clearMessage();
    }

    // ── Show/Hide Password ──
    function togglePw(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
      else { input.type = 'password'; btn.textContent = '👁️'; }
    }

    // ── Messages ──
    function showMessage(msg, type) {
      const el = document.getElementById('authMessage');
      el.textContent = msg;
      el.className = 'auth-message ' + type;
    }
    function clearMessage() {
      const el = document.getElementById('authMessage');
      el.className = 'auth-message';
      el.textContent = '';
    }

    // ── Loading State ──
    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.innerHTML = loading
        ? '<span class="spinner"></span> Please wait...'
        : (btnId === 'loginBtn' ? 'Sign In' : btnId === 'signupBtn' ? 'Create Account 🎓' : 'Continue with Google');
    }

    // ── Create Default User Data ──
    function createUserData(user, name) {
      return db.ref('users/' + user.uid).set({
        name: name || user.displayName || 'Space Learner',
        email: user.email,
        photoURL: user.photoURL || '',
        xp: 0, level: 1, streak: 0,
        lastStudied: null,
        completedLessons: [],
        quizScores: [],
        gamesPlayed: 0,
        createdAt: Date.now()
      });
    }

    // ── Email Login ──
    async function loginWithEmail() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) { showMessage('Please fill in all fields.', 'error'); return; }
      setLoading('loginBtn', true);
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (e) {
        setLoading('loginBtn', false);
        showMessage(getFriendlyError(e.code), 'error');
      }
    }

    // ── Email Signup ──
    async function signupWithEmail() {
      const name = document.getElementById('signupName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      if (!name || !email || !password) { showMessage('Please fill in all fields.', 'error'); return; }
      if (password.length < 6) { showMessage('Password must be at least 6 characters.', 'error'); return; }
      setLoading('signupBtn', true);
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await cred.user.updateProfile({ displayName: name });
        await createUserData(cred.user, name);
        showMessage('Account created! 🎉 Redirecting...', 'success');
      } catch (e) {
        setLoading('signupBtn', false);
        showMessage(getFriendlyError(e.code), 'error');
      }
    }

    // ── Google Login ──
    async function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      setLoading('googleBtn', true);
      try {
        const cred = await auth.signInWithPopup(provider);
        // First time? Create user data
        const snap = await db.ref('users/' + cred.user.uid).once('value');
        if (!snap.exists()) await createUserData(cred.user, cred.user.displayName);
      } catch (e) {
        setLoading('googleBtn', false);
        showMessage(getFriendlyError(e.code), 'error');
      }
    }

    // ── Friendly Errors ──
    function getFriendlyError(code) {
      const errors = {
        'auth/user-not-found': 'No account found with this email.',
        'auth/wrong-password': 'Incorrect password. Try again.',
        'auth/email-already-in-use': 'This email is already registered.',
        'auth/invalid-email': 'Please enter a valid email.',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/popup-closed-by-user': 'Sign-in cancelled.',
        'auth/network-request-failed': 'Network error. Check your connection.',
        'auth/too-many-requests': 'Too many attempts. Please try again later.',
      };
      return errors[code] || 'An error occurred. Please try again.';
    }

    // ── Guest Mode ──
    function enterAsGuest() {
      sessionStorage.setItem('guestMode', 'true');
      window.location.href = 'index.html';
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('loginForm').classList.contains('active')) loginWithEmail();
        else signupWithEmail();
      }
    });
  </script>
</body>
</html>
