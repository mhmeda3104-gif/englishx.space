<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="profile.css?v=8">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      min-height: 100vh; 
      background-color: var(--carrd-bg, #e8eaed);
      display: flex; 
      flex-direction: column; 
      font-family: 'Inter', sans-serif;
    }
    .navbar { display: none !important; }
    .portfolio-main { 
      flex: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 60px 20px 80px; 
    }
    .portfolio-footer {
      text-align: center;
      padding: 24px 20px;
      color: #94a3b8;
      font-size: 13px;
    }
    .portfolio-footer a {
      color: var(--primary, #2563eb);
      text-decoration: none;
      font-weight: 500;
    }
    .portfolio-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <div class="toast-container" id="toastContainer"></div>

  <main class="portfolio-main">
    <div class="carrd-site-card" id="carrdSiteCard" style="margin:0 auto;">
      <div style="text-align:center; padding:60px 20px; color:#94a3b8;">
        Loading portfolio...
      </div>
    </div>
  </main>

  <footer class="portfolio-footer">
    Powered by <a href="index.html">ESTL Tech</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBydQb6wDh4X7JA0JkcuhToJam66VD3bTM",
      authDomain: "englishx-ed1c6.firebaseapp.com",
      projectId: "englishx-ed1c6",
      storageBucket: "englishx-ed1c6.firebasestorage.app",
      messagingSenderId: "570756105739",
      appId: "1:570756105739:web:69c4b5edd62cc34c56290e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const uidQuery = urlParams.get('id') || urlParams.get('user');
      
      const card = document.getElementById('carrdSiteCard');

      if (!uidQuery) {
        card.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;"><h3>Invalid Link</h3><p>Please provide a valid user ID.</p></div>';
        return;
      }

      firebase.database().ref('users/' + uidQuery).once('value').then(snapshot => {
        try {
          if (snapshot.exists()) {
            const d = snapshot.val();
            renderPublicPortfolio(d);
          } else {
            card.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;"><h3>User Not Found</h3><p>No page found with this link.</p></div>';
          }
        } catch(renderErr) {
          card.innerHTML = '<div style="text-align:center; padding:40px; color:#ef4444;"><h3>Render Error</h3><p>' + renderErr.message + '</p></div>';
        }
      }).catch(err => {
        card.innerHTML = '<div style="text-align:center; padding:40px; color:#ef4444;"><h3>Error Loading Data</h3><p>' + err.message + '</p></div>';
      });
    });

    function renderPublicPortfolio(d) {
      // Apply Page Settings
      const s = d.pageSettings || d.customStyle || {};
      const root = document.documentElement;
      if (s.cardWidth) root.style.setProperty('--card-max-width', s.cardWidth);
      if (s.cardRadius) root.style.setProperty('--card-radius', s.cardRadius);
      if (s.bg) root.style.setProperty('--carrd-bg', s.bg);
      if (s.cardBg) root.style.setProperty('--card-bg', s.cardBg);
      if (s.primary) root.style.setProperty('--primary', s.primary);
      if (s.font) root.style.setProperty('font-family', s.font);

      if (s.siteTitle || d.name) {
        document.title = s.siteTitle || (d.name + ' - Portfolio');
      }

      // Render Blocks
      const card = document.getElementById('carrdSiteCard');
      card.innerHTML = '';

      let blocks = [];
      if (d.customBlocks && Array.isArray(d.customBlocks) && d.customBlocks.length > 0) {
        blocks = d.customBlocks;
      } else {
        blocks = generatePublicFallbackBlocks(d);
      }

      blocks.forEach(b => {
        const blockEl = document.createElement('div');
        blockEl.className = 'canvas-block';

        let html = '';

        if (b.type === 'text') {
          const alignClass = 'align-' + (b.align || 'left');
          const styleClass = 'style-' + (b.style || 'body');
          const colorAttr = b.color ? 'style="color:' + esc(b.color) + '"' : '';
          html = '<div class="block-text ' + alignClass + ' ' + styleClass + '" ' + colorAttr + '>' + esc(b.content || '') + '</div>';
        }
        else if (b.type === 'image') {
          const alignClass = 'align-' + (b.align || 'center');
          const sizeClass = 'size-' + (b.size || 'medium');
          const radiusClass = 'radius-' + (b.radius || 'rounded');
          const imgUrl = b.url || 'logo.png';
          const imgTag = '<img src="' + esc(imgUrl) + '" alt="Image" loading="lazy">';
          const linkedImg = b.link ? '<a href="' + esc(b.link) + '" target="_blank">' + imgTag + '</a>' : imgTag;
          const captionTag = b.caption ? '<div class="block-image-caption">' + esc(b.caption) + '</div>' : '';

          html = '<div class="block-image-wrap ' + alignClass + ' ' + sizeClass + ' ' + radiusClass + '">' +
                   '<div class="block-image-content">' + linkedImg + captionTag + '</div>' +
                 '</div>';
        }
        else if (b.type === 'buttons') {
          const layoutClass = 'layout-' + (b.layout || 'column');
          const alignClass = 'align-' + (b.align || 'center');
          const btnsHtml = (b.buttons || []).map(btn => {
            const btnStyle = 'btn-' + (btn.style || 'solid');
            return '<a href="' + esc(btn.url || '#') + '" target="_blank" class="block-btn-item ' + btnStyle + '">' + esc(btn.title || 'Button') + '</a>';
          }).join('');

          html = '<div class="block-buttons ' + layoutClass + ' ' + alignClass + '">' + btnsHtml + '</div>';
        }
        else if (b.type === 'gallery') {
          const cols = b.cols || 3;
          const imgs = b.images || ['logo.png', 'logo.png', 'logo.png'];
          const imgsHtml = imgs.map(img => 
            '<div style="aspect-ratio:1; overflow:hidden; border-radius:6px; background:#f1f5f9;">' +
              '<img src="' + esc(img) + '" style="width:100%; height:100%; object-fit:cover;">' +
            '</div>'
          ).join('');
          html = '<div style="display:grid; grid-template-columns:repeat(' + cols + ', 1fr); gap:12px; width:100%;">' + imgsHtml + '</div>';
        }
        else if (b.type === 'video') {
          const videoUrl = b.url || '';
          let mediaTag = '';
          if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
            const embedUrl = getYouTubeEmbedUrl(videoUrl);
            mediaTag = '<iframe src="' + embedUrl + '" allowfullscreen></iframe>';
          } else {
            mediaTag = '<video src="' + esc(videoUrl)" autoplay loop muted playsinline></video>';
          }
          html = '<div class="block-video">' + mediaTag + '</div>';
        }
        else if (b.type === 'divider') {
          const styleClass = 'style-' + (b.style || 'line');
          html = '<div class="block-divider ' + styleClass + '"><hr></div>';
        }
        else if (b.type === 'icons') {
          const iconsList = b.icons || [
            { name: 'Instagram', url: (d.social && d.social.instagram) || '#' },
            { name: 'GitHub', url: (d.social && d.social.github) || '#' },
            { name: 'Website', url: (d.social && d.social.website) || '#' }
          ];
          const iconsHtml = iconsList.map(ic => 
            '<a href="' + esc(ic.url) + '" target="_blank" class="profile-socials" style="display:inline-flex; padding:6px 14px; background:#f1f5f9; border-radius:999px; text-decoration:none; font-size:12px; font-weight:600; color:#334155;">' +
              esc(ic.name) +
            '</a>'
          ).join('');
          html = '<div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:' + (b.align || 'center') + '; width:100%;">' + iconsHtml + '</div>';
        }

        blockEl.innerHTML = html;
        card.appendChild(blockEl);
      });
    }

    function generatePublicFallbackBlocks(d) {
      const blocks = [];
      if (d.photoURL) {
        blocks.push({ type: 'image', url: d.photoURL, size: 'avatar', radius: 'circle', align: 'center' });
      }
      blocks.push({ type: 'text', content: d.name || 'My Untitled Site', style: 'h1', align: 'center' });
      if (d.bio) blocks.push({ type: 'text', content: d.bio, style: 'body', align: 'center' });

      const linkBtns = [];
      const social = d.social || {};
      if (social.github) linkBtns.push({ title: 'GitHub', url: social.github, style: 'outline' });
      if (social.instagram) linkBtns.push({ title: 'Instagram', url: social.instagram, style: 'outline' });
      if (social.website) linkBtns.push({ title: 'Website', url: social.website, style: 'solid' });
      (d.customLinks || []).forEach(l => {
        if (l.title && l.url) linkBtns.push({ title: l.title, url: l.url, style: 'solid' });
      });

      if (linkBtns.length > 0) {
        blocks.push({ type: 'buttons', buttons: linkBtns, layout: 'column', align: 'center' });
      }
      return blocks;
    }

    function getYouTubeEmbedUrl(url) {
      let videoId = '';
      if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
      else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1].split('&')[0];
      return videoId ? 'https://www.youtube.com/embed/' + videoId : url;
    }

    function esc(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
