<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engineer Portfolio - ESTL Tech</title>
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="stylesheet" href="profile.css?v=5">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    body { padding-top: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .navbar { display: none !important; }
    .portfolio-main { flex: 1; padding: 40px 20px 80px; }
    .portfolio-footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }
    .portfolio-footer a {
      color: var(--primary);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  
  <div class="toast-container" id="toastContainer"></div>

  <main class="portfolio-main">
    <div class="modular-canvas" id="modularCanvas">
      <div style="text-align:center; padding:60px 20px; color:var(--text-muted);">
        Loading portfolio...
      </div>
    </div>
  </main>

  <footer class="portfolio-footer">
    Powered by <a href="index.html">ESTL Tech</a>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBydQb6wDh4X7JA0JkcuhToJam66VD3bTM",
      authDomain: "englishx-ed1c6.firebaseapp.com",
      projectId: "englishx-ed1c6",
      storageBucket: "englishx-ed1c6.firebasestorage.app",
      messagingSenderId: "570756105739",
      appId: "1:570756105739:web:69c4b5edd62cc34c56290e"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const uidQuery = urlParams.get('id') || urlParams.get('user');
      
      const canvas = document.getElementById('modularCanvas');

      if (!uidQuery) {
        canvas.innerHTML = '<div style="text-align:center; padding:60px; color:var(--text-muted);"><h3>Invalid Link</h3><p>Please provide a valid user ID.</p></div>';
        return;
      }

      firebase.database().ref('users/' + uidQuery).once('value').then(snapshot => {
        try {
          if (snapshot.exists()) {
            const d = snapshot.val();
            renderPublicPortfolio(d);
          } else {
            canvas.innerHTML = '<div style="text-align:center; padding:60px; color:var(--text-muted);"><h3>User Not Found</h3><p>No engineer found with this link.</p></div>';
          }
        } catch(renderErr) {
          canvas.innerHTML = '<div style="text-align:center; padding:60px; color:var(--danger);"><h3>Render Error</h3><p>' + renderErr.message + '</p></div>';
        }
      }).catch(err => {
        canvas.innerHTML = '<div style="text-align:center; padding:60px; color:var(--danger);"><h3>Error Loading Data</h3><p>' + err.message + '</p></div>';
      });
    });

    function renderPublicPortfolio(d) {
      // 1. Apply Theme & Page Settings
      if (d.theme) document.body.classList.add('theme-' + d.theme);

      const settings = d.pageSettings || d.customStyle || {};
      const root = document.documentElement;
      if (settings.canvasWidth) root.style.setProperty('--canvas-max-width', settings.canvasWidth);
      if (settings.bg) root.style.setProperty('--bg-primary', settings.bg);
      if (settings.card) root.style.setProperty('--bg-card', settings.card);
      if (settings.primary) root.style.setProperty('--primary', settings.primary);
      if (settings.text) root.style.setProperty('--text-primary', settings.text);
      if (settings.font) root.style.setProperty('font-family', settings.font);

      if (d.name) {
        document.title = d.name + ' - Portfolio';
      }

      // 2. Render Blocks
      const canvas = document.getElementById('modularCanvas');
      canvas.innerHTML = '';

      let blocks = [];
      if (d.customBlocks && Array.isArray(d.customBlocks) && d.customBlocks.length > 0) {
        blocks = d.customBlocks;
      } else {
        blocks = generateStarterBlocks(d);
      }

      blocks.forEach(b => {
        const blockEl = document.createElement('div');
        blockEl.className = 'canvas-block';

        let innerHtml = '';

        if (b.type === 'image') {
          const alignClass = 'align-' + (b.align || 'center');
          const sizeClass = 'size-' + (b.size || 'medium');
          const radiusClass = 'radius-' + (b.radius || 'rounded');
          const imgUrl = b.url || 'logo.png';
          const imgTag = '<img src="' + esc(imgUrl) + '" alt="Image" loading="lazy">';
          const linkedImg = b.link ? '<a href="' + esc(b.link) + '" target="_blank">' + imgTag + '</a>' : imgTag;
          const captionTag = b.caption ? '<div class="block-image-caption">' + esc(b.caption) + '</div>' : '';

          innerHtml = '<div class="block-image-wrap ' + alignClass + ' ' + sizeClass + ' ' + radiusClass + '">' +
                        '<div class="block-image-content">' + linkedImg + captionTag + '</div>' +
                      '</div>';
        }
        else if (b.type === 'text') {
          const alignClass = 'align-' + (b.align || 'center');
          const styleClass = 'style-' + (b.style || 'body');
          const colorStyle = b.color ? 'style="color:' + esc(b.color) + '"' : '';
          innerHtml = '<div class="block-text ' + alignClass + ' ' + styleClass + '" ' + colorStyle + '>' + esc(b.content || '') + '</div>';
        }
        else if (b.type === 'buttons') {
          const layoutClass = 'layout-' + (b.layout || 'column');
          const alignClass = 'align-' + (b.align || 'center');
          const btnsHtml = (b.buttons || []).map(btn => {
            const btnStyle = 'btn-' + (btn.style || 'solid');
            return '<a href="' + esc(btn.url || '#') + '" target="_blank" class="block-btn-item ' + btnStyle + '">' + esc(btn.title || 'Link') + '</a>';
          }).join('');

          innerHtml = '<div class="block-buttons ' + layoutClass + ' ' + alignClass + '">' + btnsHtml + '</div>';
        }
        else if (b.type === 'divider') {
          const styleClass = 'style-' + (b.style || 'line');
          innerHtml = '<div class="block-divider ' + styleClass + '"><hr></div>';
        }
        else if (b.type === 'video') {
          const videoUrl = b.url || '';
          let mediaTag = '';
          if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
            const embedUrl = getYouTubeEmbedUrl(videoUrl);
            mediaTag = '<iframe src="' + embedUrl + '" allowfullscreen></iframe>';
          } else {
            const autoplayAttr = b.autoplay ? 'autoplay loop muted playsinline' : 'controls';
            mediaTag = '<video src="' + esc(videoUrl) + '" ' + autoplayAttr + '></video>';
          }
          innerHtml = '<div class="block-video">' + mediaTag + '</div>';
        }

        blockEl.innerHTML = innerHtml;
        canvas.appendChild(blockEl);
      });
    }

    function generateStarterBlocks(d) {
      const blocks = [];
      if (d.coverPhoto) {
        blocks.push({ type: 'image', url: d.coverPhoto, size: 'full', radius: 'rounded', align: 'center' });
      }
      blocks.push({ type: 'image', url: d.photoURL || 'logo.png', size: 'avatar', radius: 'circle', align: 'center' });
      blocks.push({ type: 'text', content: d.name || 'Space Engineer', style: 'h1', align: 'center' });
      if (d.username) blocks.push({ type: 'text', content: '@' + d.username, style: 'h3', align: 'center', color: 'var(--primary)' });
      if (d.bio) blocks.push({ type: 'text', content: d.bio, style: 'body', align: 'center' });

      const linkBtns = [];
      const social = d.social || {};
      if (social.github) linkBtns.push({ title: 'GitHub', url: social.github, style: 'outline' });
      if (social.instagram) linkBtns.push({ title: 'Instagram', url: social.instagram, style: 'outline' });
      if (social.website) linkBtns.push({ title: 'Website', url: social.website, style: 'outline' });
      (d.customLinks || []).forEach(l => {
        if (l.title && l.url) linkBtns.push({ title: l.title, url: l.url, style: 'solid' });
      });

      if (linkBtns.length > 0) {
        blocks.push({ type: 'buttons', buttons: linkBtns, layout: 'column', align: 'center' });
      }
      return blocks;
    }

    function getYouTubeEmbedUrl(url) {
      let videoId = '';
      if (url.includes('youtu.be/')) {
        videoId = url.split('youtu.be/')[1].split('?')[0];
      } else if (url.includes('watch?v=')) {
        videoId = url.split('watch?v=')[1].split('&')[0];
      }
      return videoId ? 'https://www.youtube.com/embed/' + videoId : url;
    }

    function esc(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
