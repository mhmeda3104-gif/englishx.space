<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Chat - Space Academy</title>
  <meta name="description" content="Join the Space Academy global chat and talk with other learners!">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="chat.css">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body class="dashboard-body">

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon"><img src="logo.png" alt="Space Academy"></div>
      <span class="brand-text">Space Academy</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="lessons.html">Lessons</a></li>
      <li><a href="quiz.html">Quiz</a></li>
      <li><a href="game.html">Games</a></li>
      <li><a href="movies.html">Movies ??</a></li><li><a href="members.html">Members</a></li>
      <li><a href="chat.html" class="active">Chat</a></li>
      <li><a href="chat.html">Chat</a></li><li><a href="profile.html">Profile</a></li>
    </ul>
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme" onclick="toggleTheme()">☀️</button>
  </nav>

  <div class="toast-container" id="toastContainer"></div>

  <div class="container" style="padding-top: 100px; padding-bottom: 50px;">
    
    <div class="chat-container">
      <div class="chat-header">
        <h1>💬 Global Chat</h1>
        <span style="font-size: 0.9rem; color: var(--text-muted);">Say hello! 👋</span>
      </div>
      
      <div class="chat-messages" id="chatMessages">
        <div class="chat-notice" id="chatLoading">Connecting to global chat...</div>
      </div>
      
      <form class="chat-input-area" id="chatForm">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." autocomplete="off" disabled>
        <button type="submit" id="chatSendBtn" class="chat-send-btn" disabled>➤</button>
      </form>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="auth-guard.js"></script>
  <script src="app.js"></script>
  <script src="chat.js"></script>
</body>
</html>
